<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaceTrack · Eventos deportivos</title>
  <link rel="stylesheet" href="/styles.css"><script src="/client.js" defer></script>
</head>
<body>
  <header><span>RACETRACK</span><h1>Tu próxima carrera empieza aquí.</h1><p>Consulta eventos, inscríbete y sigue los resultados.</p></header>
  <main>
    <section aria-labelledby="account-title"><h2 id="account-title">Mi cuenta</h2>
      <form id="account-form"><label>Nombre (para registrarte)<input id="name" autocomplete="name" maxlength="100"></label>
        <label>Correo<input id="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
        <div class="actions"><button id="login" type="submit">Entrar</button><button id="register" type="button">Crear cuenta</button><button id="logout" type="button" hidden>Salir</button></div>
      </form><p id="account-status" role="status">Inicia sesión para inscribirte.</p>
    </section>
    <section aria-labelledby="events-title"><div class="section-heading"><h2 id="events-title">Eventos</h2><button id="refresh" type="button">Actualizar</button></div>
      <p id="events-status" role="status"></p><div id="events"></div>
      <div class="actions"><button id="previous" type="button" disabled>Anterior</button><span id="page-number">Página 1</span><button id="next" type="button">Siguiente</button></div>
    </section>
    <section aria-labelledby="registration-title"><h2 id="registration-title">Inscribirme</h2>
      <form id="registration-form"><label>Evento<select id="event" required><option value="">Selecciona un evento</option></select></label>
        <label>Categoría<select id="category" required><option value="">Selecciona una categoría</option></select></label>
        <button id="submit-registration" type="submit">Confirmar inscripción</button>
      </form><p id="registration-status" role="status"></p><button id="cancel-registration" type="button" hidden>Cancelar mi inscripción</button>
    </section>
    <section aria-labelledby="ranking-title"><h2 id="ranking-title">Clasificación</h2>
      <p id="ranking-status" role="status">Elige «Ver clasificación» en un evento.</p>
      <ol id="ranking"></ol>
    </section>
  </main><footer>RaceTrack · Eventos, participación y resultados</footer>
</body></html>
