name: Continuous Testing

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/RACE-*', 'docs/RACE-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Node tests + Jest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      - name: Ejecutar pruebas existentes con Node Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Ejecutar pruebas unitarias e integración con Jest
        run: npm run test:jest
        env:
          NODE_ENV: test

  acceptance:
    name: Newman + Selenium + JMeter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      - name: Instalar JMeter 5.6.3
        run: |
          curl --fail --location --retry 3 https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o "$RUNNER_TEMP/jmeter.tgz"
          tar -xzf "$RUNNER_TEMP/jmeter.tgz" -C "$RUNNER_TEMP"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-5.6.3" >> "$GITHUB_ENV"

      - name: Ejecutar Newman, Selenium y JMeter
        run: npm run qa:acceptance

      - name: Generar reporte de regresión
        run: npm run regression -- --require-team

      - name: Guardar evidencias QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racetrack-final-qa
          path: |
            evidence/team/
            evidence/generated/
          if-no-files-found: error
