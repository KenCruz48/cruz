name: Continuous Testing

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/RACE-*', 'docs/RACE-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} tests + Jest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      - name: Ejecutar pruebas existentes con Node Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Ejecutar pruebas unitarias e integración con Jest
        run: npm run test:jest
        env:
          NODE_ENV: test

  acceptance:
    name: Integration, Newman, Selenium and JMeter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      - name: Install JMeter 5.6.3
        run: |
          jmeter_downloaded=false
          for jmeter_source in https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz; do
            if curl --fail --location --connect-timeout 15 --max-time 120 --retry 1 --retry-delay 3 "$jmeter_source" -o "$RUNNER_TEMP/jmeter.tgz"; then
              jmeter_downloaded=true
              break
            fi
          done
          if [ "$jmeter_downloaded" != true ]; then echo "JMeter download failed"; exit 1; fi
          echo "5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083  $RUNNER_TEMP/jmeter.tgz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/jmeter.tgz" -C "$RUNNER_TEMP"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-5.6.3" >> "$GITHUB_ENV"

      - name: Ejecutar Newman, Selenium y JMeter
        run: npm run qa:acceptance

      - name: Generar reporte de regresión
        run: npm run regression -- --require-team

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racetrack-final-qa
          path: |
            evidence/team/
            evidence/generated/
          if-no-files-found: error
